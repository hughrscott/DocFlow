# Synthetic-only verification. Tests use temporary roots, deny network egress,
# and replace the model transport; this workflow uses no secrets, uploads no
# artifacts, and keeps no caches.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Synthetic-only verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Confirm exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OCR and PDF runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install project and dev dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Privacy preflight
        run: |
          python tools/privacy_preflight.py

      - name: Lint
        run: |
          ruff check docflow tools

      - name: Test
        run: |
          python -m pytest -p no:cacheprovider
