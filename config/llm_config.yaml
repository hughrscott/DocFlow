# DocFlow LLM Configuration
# Configure which LLM providers to use and their settings

llm:
  # Primary provider for document analysis
  vision_provider: "ollama"  # Options: "claude", "ollama", "openai"
  text_provider: "ollama"    # Options: "claude", "ollama", "openai"
  
  # Fallback chain if primary provider fails
  fallback_providers:
    - "ollama"
    - "claude"

# Provider-specific configurations
providers:
  claude:
    enabled: false
    api_key: "${CLAUDE_API_KEY}"  # Read from environment
    model: "claude-3-5-sonnet-20241022"
    vision_model: "claude-3-5-sonnet-20241022"
    timeout: 30
    max_retries: 3

  ollama:
    enabled: true  # Set to true if you have Ollama running
    base_url: "http://localhost:11434"
    vision_model: "llava:latest"  # Run: ollama pull llava
    text_model: "mistral:latest"  # Run: ollama pull mistral
    timeout: 60
    max_retries: 2

  openai:
    enabled: false
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4-vision-preview"
    vision_model: "gpt-4-vision-preview"
    timeout: 30
    max_retries: 3

# Retry and error handling
retry_strategy:
  max_attempts: 3
  backoff_multiplier: 2
  initial_delay: 1  # seconds

# Document Analysis Settings
document_analysis:
  extract_dates: true
  extract_amounts: true
  extract_accounts: true
  confidence_threshold: 0.7
  max_tokens: 1500

# Folder Routing Settings
folder_routing:
  auto_create_folders: true
  create_depth: 3  # How deep to create folder hierarchies
  naming_convention: "{institution}_{document_type}_{date}_{account_info}"

# Learning System Settings
learning:
  enabled: true
  track_decisions: true
  learn_folder_patterns: true
  min_samples_for_pattern: 5
  update_frequency: "hourly"
