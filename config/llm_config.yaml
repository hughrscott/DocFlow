llm:
  vision_provider: ollama
  text_provider: ollama
  fallback_providers:
  - ollama
  - claude
providers:
  claude:
    enabled: false
    api_key: ${CLAUDE_API_KEY}
    model: claude-3-5-sonnet-20241022
    vision_model: claude-3-5-sonnet-20241022
    timeout: 30
    max_retries: 3
  ollama:
    enabled: true
    base_url: http://localhost:11434
    vision_model: llava:latest
    text_model: mistral:latest
    timeout: 60
    max_retries: 2
  openai:
    enabled: false
    api_key: ${OPENAI_API_KEY}
    model: gpt-4-vision-preview
    vision_model: gpt-4-vision-preview
    timeout: 30
    max_retries: 3
retry_strategy:
  max_attempts: 3
  backoff_multiplier: 2
  initial_delay: 1
document_analysis:
  extract_dates: true
  extract_amounts: true
  extract_accounts: true
  confidence_threshold: 0.7
  max_tokens: 1500
folder_routing:
  auto_create_folders: true
  create_depth: 3
  naming_convention: '{institution}_{document_type}_{date}_{account_info}'
learning:
  enabled: true
  track_decisions: true
  learn_folder_patterns: true
  min_samples_for_pattern: 5
  update_frequency: hourly
