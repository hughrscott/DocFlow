# Mail Archiver — Hugh Scott's Config
# This is the live config. Edit freely.

# Global settings
archive_root: ~/Library/Mobile Documents/com~apple~CloudDocs/ElectronicFiles
scan_watch_folder: ~/Library/Mobile Documents/com~apple~CloudDocs/ElectronicFiles/ToBeOrganized
confidence_threshold: 0.75

# LLM settings
llm_provider: openrouter
llm_model: google/gemini-2.0-flash-001

# Filing rules — human-readable markdown (used by LLM for classification)
rules_file: config/rules.md
# llm_api_key loaded from .env (OPENROUTER_API_KEY)

# User identity
user:
  name: Hugh Scott
  address: 3615 Robinhood St, Houston TX 77005

# Family members
family:
  - name: Vivian Scott
    relation: spouse
  - name: Brodie Scott
    relation: son
  - name: Kirstie Scott
    relation: daughter

# Business entities
entities:
  - id: sulis_solar
    name: Sulis Solar LLC
    type: business
    directory: SulisSolar
    banks: [pnc]
    account_hints: ["sulis", "1236"]

  - id: sor_heights
    name: School of Rock The Heights
    legal_name: Flagstore LLC
    type: business
    directory: SOR/SORHeights
    banks: [frost]
    address: "742 E 20th St, Houston TX 77008"

  - id: sor_west_u
    name: School of Rock West U
    legal_name: SOR Houston SW LLC
    type: business
    directory: SOR/SORHoustonSW
    banks: [frost]

  - id: together_solar
    name: Together Solar
    type: investment
    directory: Investments/Together Solar

  - id: great_scott
    name: GreatScott Consulting
    type: business
    directory: GreatScottConsulting

# Filing rules — evaluated top to bottom, first match wins
filing_rules:
  - id: pnc_sulis_solar_checking
    match:
      institution: pnc
      account_hints: ["sulis", "solar", "1236"]
      doc_type: [statement, checking]
    file_to: SulisSolar/PNC
    filename_template: "PNCBankSulisSolarChecking{period}.pdf"

  - id: pnc_personal_loc
    match:
      institution: pnc
      doc_type: [line_of_credit, loc]
    file_to: PNC/Personal/LOC
    filename_template: "PNCPersonalLineOfCredit{period}.pdf"

  - id: frost_sor_houston_sw
    match:
      institution: frost
      entity_hints: ["sor houston", "742 e 20th", "school of rock"]
    file_to: Frost/SORHoustonSW/Checking
    filename_template: "FrostSORHoustonSWChecking{period}.pdf"

  - id: guardian_insurance_eob
    match:
      institution: guardian
      doc_type: [eob, explanation_of_benefits]
    file_to: Insurance/Guardian Health
    filename_template: "GuardianLifeInsuranceEOB{period}{person}.pdf"

  - id: houston_alarm
    match:
      institution: ["city of houston", "houston emergency", "burglar alarm"]
    file_to: SOR/SORHeights
    filename_template: "HoustonEmergencyAlarmFeeSchedule{period}.pdf"

  - id: bettencourt_tax
    match:
      institution: bettencourt
      doc_type: [invoice, statement, bill, tax_notice]
    file_to: "Tax/{year} Taxes"
    filename_template: "BettencourtTaxAdvisors{doc_type}{period}.pdf"

  - id: lloyds_uk
    match:
      institution: lloyds
    file_to: UK Finance/Lloyds
    filename_template: "LloydsBankAccountStatement{period}.pdf"

  - id: medical_pesikoff
    match:
      institution: ["pesikoff", "core primary care", "privia"]
      doc_type: [bill, statement, visit_summary]
    file_to: Medical/Pesikoff
    filename_template: "PesikoffCoreVisitBill{period}{person}.pdf"

  # Edge case: Maryland Registered Agent invoices → Together Solar
  - id: together_solar_registered_agent
    match:
      institution: ["corporate filings", "maryland"]
      doc_type: [invoice]
    file_to: Investments/Together Solar
    filename_template: "TogetherSolarRegisteredAgent{period}.pdf"

  # Edge case: Transnational / Celero (payment processor for SOR)
  - id: transnational_sor
    match:
      institution: ["transnational", "celero"]
    file_to: SOR/SORHeights
    filename_template: "TransnationalCelero{period}.pdf"

  # Blue Cross / BCBS
  - id: bluecross_eob
    match:
      institution: ["blue cross", "blue shield", "bcbs"]
      doc_type: [eob, explanation_of_benefits]
    file_to: Insurance/BlueCross
    filename_template: "BlueCrossEOB{period}{person}.pdf"

  # Guardian — catch-all for non-EOB Guardian docs (letters, notices)
  - id: guardian_general
    match:
      institution: guardian
    file_to: Insurance/Guardian Health
    filename_template: "GuardianLifeInsurance{doc_type}{period}.pdf"

  # Harris County property tax
  - id: harris_county_tax
    match:
      institution: harris_county_tax
    file_to: "Tax/{year} Taxes/Harris County"
    filename_template: "HarrisCountyPropertyTax{period}.pdf"

  # Cirro Energy — SOR Heights utility
  - id: cirro_energy_sor
    match:
      institution: cirro_energy
      entity_hints: ["flag store", "flagstore"]
    file_to: SOR/SORHeights/Utilities
    filename_template: "CirroEnergy{period}.pdf"

  # Cirro Energy — personal/other
  - id: cirro_energy_personal
    match:
      institution: cirro_energy
    file_to: Utilities/CirroEnergy
    filename_template: "CirroEnergy{period}.pdf"

  # US Bank mortgage
  - id: usbank_mortgage
    match:
      institution: usbank
      doc_type: [statement, bill, invoice]
    file_to: USBank/Mortgage
    filename_template: "USBankMortgage{doc_type}{period}.pdf"

  # US Bank — catch-all (tax forms, notices)
  - id: usbank_general
    match:
      institution: usbank
    file_to: USBank
    filename_template: "USBank{doc_type}{period}.pdf"

  # Routt County property tax (Colorado)
  - id: routt_county_tax
    match:
      institution: routt_county
    file_to: "Tax/{year} Taxes/Routt County"
    filename_template: "RouttCountyPropertyTax{period}.pdf"

  # Rippling W-2 / payroll
  - id: rippling_w2
    match:
      institution: rippling
      doc_type: [w2]
    file_to: "Tax/{year} Taxes/W2"
    filename_template: "RipplingW2{period}.pdf"

  # Rippling — catch-all (other payroll docs)
  - id: rippling_general
    match:
      institution: rippling
    file_to: "Tax/{year} Taxes/Payroll"
    filename_template: "Rippling{doc_type}{period}.pdf"

  # Texas Workforce Commission
  - id: tx_workforce
    match:
      institution: tx_workforce
    file_to: Business/Texas Workforce Commission
    filename_template: "TexasWorkforceCommission{doc_type}{period}.pdf"

  # Texas Comptroller — for GS Consulting / GreatScott
  - id: tx_comptroller_gs
    match:
      institution: tx_comptroller
      entity_hints: ["gs consulting", "greatscott", "great scott"]
    file_to: GreatScottConsulting/Texas Comptroller
    filename_template: "TexasComptroller{doc_type}{period}.pdf"

  # Texas Comptroller — general
  - id: tx_comptroller_general
    match:
      institution: tx_comptroller
    file_to: "Tax/{year} Taxes/Texas Comptroller"
    filename_template: "TexasComptroller{doc_type}{period}.pdf"
