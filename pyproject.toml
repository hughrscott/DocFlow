[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docflow"
version = "1.0.0"
description = "Local-first document archiving with OCR and AI classification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pypdf~=6.9",
    "pdf2image~=1.17",
    "pytesseract~=0.3.13",
    "Pillow~=12.0",
    "openai~=2.30",
    "python-dotenv~=1.2",
    "openpyxl~=3.1",
    "pyyaml~=6.0",
    "rich~=14.0",
    "click~=8.3",
    "fastapi~=0.135",
    "uvicorn~=0.43",
    "sse-starlette~=3.3",
    "python-multipart~=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "ruff",
]

[project.scripts]
docflow = "docflow.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["docflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
