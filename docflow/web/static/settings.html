<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DocFlow — Settings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,400..600,0..1&display=swap" rel="stylesheet"/>
    <script src="/static/config.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-canvas text-ink">
    <div id="nav"></div>
    <div class="df-main">
        <div id="header"></div>
        <div class="df-body df-scroll">

    <main class="p-[20px_16px] lg:p-[32px_34px] max-w-[1180px] lg:min-w-[1020px] mx-auto flex flex-col lg:flex-row gap-7 items-stretch lg:items-start">
        <!-- Left column -->
        <div class="flex-1 min-w-0 flex flex-col gap-[34px]">

            <!-- Entities & Family -->
            <section>
                <div class="flex items-center justify-between mb-[18px]">
                    <div>
                        <h3 class="m-0 font-headline font-extrabold text-[22px] tracking-[-0.01em]">Entities &amp; Family Members</h3>
                        <p class="m-0 mt-[5px] text-text-olive text-[13.5px]">Profiles and business entities the archivist uses to route filings.</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openAddFamily()" class="flex items-center gap-[6px] bg-white border border-border-primary rounded-btn py-[9px] px-[14px] text-[12.5px] font-bold text-ink cursor-pointer hover:bg-soft-hover transition-colors">
                            <span class="ms" style="font-size:16px;">person_add</span> Add Person
                        </button>
                        <button onclick="openAddEntity()" class="flex items-center gap-[6px] bg-ink text-[#F4F1EA] border-none rounded-btn py-[9px] px-[14px] text-[12.5px] font-bold cursor-pointer hover:-translate-y-px transition-transform">
                            <span class="ms" style="font-size:16px;">add</span> Add Entity
                        </button>
                    </div>
                </div>
                <div id="entities-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </section>

            <!-- Storage & Paths -->
            <section>
                <h3 class="m-0 mb-4 font-headline font-extrabold text-[22px] tracking-[-0.01em]">Storage &amp; Paths</h3>
                <div class="flex flex-col gap-[14px]">
                    <div>
                        <label class="block text-[10px] font-bold tracking-[.1em] uppercase text-text-label mb-[7px]">Archive Root Directory</label>
                        <input id="archive-root" class="w-full bg-white border border-border-primary rounded-[11px] py-3 px-[14px] font-mono font-medium text-[12.5px] text-ink outline-none" type="text"/>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold tracking-[.1em] uppercase text-text-label mb-[7px]">Scan Watch Folder</label>
                        <input id="watch-folder" class="w-full bg-white border border-border-primary rounded-[11px] py-3 px-[14px] font-mono font-medium text-[12.5px] text-ink outline-none" type="text"/>
                    </div>
                </div>
            </section>

            <!-- AI Processing Engine (dark card) -->
            <section class="bg-ink rounded-[18px] p-7 text-[#F4F1EA]">
                <div class="flex items-center gap-[10px] mb-[22px]">
                    <span class="ms" style="font-size:22px;color:#C0A86E;">auto_awesome</span>
                    <h3 class="m-0 font-headline font-extrabold text-[20px]">AI Processing Engine</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-[18px]">
                    <!-- Provider -->
                    <div>
                        <label class="block text-[10px] font-bold tracking-[.1em] uppercase mb-[9px]" style="color:#8E8F86;">Provider</label>
                        <select id="llm-provider" onchange="onProviderChange()"
                            class="w-full bg-white/[.08] border border-white/[.14] rounded-[11px] py-3 px-[14px] text-[13px] font-semibold text-[#F4F1EA] outline-none appearance-none cursor-pointer"
                            style="background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22%23F4F1EA%22><path d=%22M7 10l5 5 5-5z%22/></svg>');background-repeat:no-repeat;background-position:right 12px center;">
                            <option value="openrouter" style="color:#15171C;">OpenRouter</option>
                            <option value="openai" style="color:#15171C;">OpenAI</option>
                            <option value="groq" style="color:#15171C;">Groq</option>
                            <option value="ollama" style="color:#15171C;">Ollama (Local)</option>
                        </select>
                    </div>
                    <!-- Model -->
                    <div>
                        <label class="block text-[10px] font-bold tracking-[.1em] uppercase mb-[9px]" style="color:#8E8F86;">Model</label>
                        <input id="llm-model" class="w-full bg-white/[.08] border border-white/[.14] rounded-[11px] py-3 px-[14px] font-mono font-medium text-[12px] text-[#F4F1EA] outline-none" type="text" placeholder="google/gemini-2.0-flash-001"/>
                    </div>
                    <!-- API Endpoint -->
                    <div>
                        <label class="block text-[10px] font-bold tracking-[.1em] uppercase mb-[9px]" style="color:#8E8F86;">API Endpoint</label>
                        <input id="llm-base-url" class="w-full bg-white/[.08] border border-white/[.14] rounded-[11px] py-3 px-[14px] font-mono font-medium text-[11px] outline-none" style="color:#C5C6BD;" type="text" placeholder="https://openrouter.ai/api/v1"/>
                    </div>
                    <!-- API Key -->
                    <div>
                        <label class="block text-[10px] font-bold tracking-[.1em] uppercase mb-[9px]" style="color:#8E8F86;">API Key</label>
                        <input id="llm-api-key" class="w-full bg-white/[.08] border border-white/[.14] rounded-[11px] py-3 px-[14px] font-mono font-medium text-[12px] outline-none" style="color:#C5C6BD;" type="password" placeholder="sk-or-v1-..."/>
                    </div>
                </div>
                <!-- Confidence threshold -->
                <div class="mt-6 max-w-[460px]">
                    <div class="flex justify-between items-center mb-[11px]">
                        <label class="text-[10px] font-bold tracking-[.1em] uppercase" style="color:#8E8F86;">Confidence Threshold</label>
                        <span id="threshold-display" class="font-headline font-extrabold text-[15px]" style="color:#C0A86E;">75%</span>
                    </div>
                    <input id="threshold-slider" aria-label="Confidence threshold"
                        class="w-full cursor-pointer" style="accent-color:#C0A86E;"
                        max="100" min="50" type="range" value="75"/>
                    <div class="flex justify-between mt-[7px] text-[10px]" style="color:#73746C;">
                        <span>More auto-filing</span><span>More review</span>
                    </div>
                </div>
                <div class="mt-6 flex gap-[10px] flex-wrap">
                    <button onclick="saveSettings()"
                        class="bg-[#F4F1EA] text-ink border-none rounded-[11px] py-[11px] px-5 font-bold text-[13px] cursor-pointer">
                        Save Settings
                    </button>
                    <button onclick="testConnection()" id="btn-test-conn"
                        class="bg-white/[.08] text-[#F4F1EA] border border-white/[.18] rounded-[11px] py-[11px] px-[18px] font-bold text-[13px] cursor-pointer flex items-center gap-[7px]">
                        <span class="ms" style="font-size:17px;">cable</span> Test Connection
                    </button>
                    <button onclick="validatePaths()"
                        class="bg-white/[.08] text-[#F4F1EA] border border-white/[.18] rounded-[11px] py-[11px] px-[18px] font-bold text-[13px] cursor-pointer flex items-center gap-[7px]">
                        <span class="ms" style="font-size:17px;">folder_open</span> Verify Paths
                    </button>
                </div>
            </section>
        </div>

        <!-- Right column -->
        <div class="w-full lg:w-[316px] flex-shrink-0 flex flex-col gap-[18px]">
            <!-- Filing Rules -->
            <div class="bg-white border border-border-primary rounded-card p-5 shadow-card">
                <div class="flex items-center justify-between mb-4">
                    <h4 class="m-0 font-headline font-bold text-[15px] flex items-center gap-[7px]">
                        <span class="ms" style="font-size:19px;color:#B5751F;">rule</span> Filing Rules
                    </h4>
                    <span id="rule-count" class="bg-success-bg text-success text-[10.5px] font-bold py-[3px] px-[9px] rounded-pill"></span>
                </div>
                <div id="rules-list" class="df-scroll flex flex-col gap-[7px] max-h-[360px] overflow-y-auto"></div>
                <button onclick="openAddRule()" class="mt-3 w-full flex items-center justify-center gap-[6px] bg-inset border border-border-card rounded-[11px] py-[10px] text-[12px] font-bold text-text-muted cursor-pointer hover:bg-sidebar transition-colors">
                    <span class="ms" style="font-size:16px;">add</span> Add Rule
                </button>
            </div>

            <!-- System Health -->
            <div class="bg-white border border-border-primary rounded-card p-5 shadow-card">
                <h4 class="m-0 mb-4 font-headline font-bold text-[15px]">System Health</h4>
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[12.5px] text-text-olive">LLM Provider</span>
                    <span class="font-headline font-bold text-[13px] text-ink" id="health-llm">—</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-[12.5px] text-text-olive">API Status</span>
                    <div class="flex items-center gap-[6px]" id="health-api">
                        <span class="w-[7px] h-[7px] rounded-pill bg-text-dim"></span>
                        <span class="text-[12.5px] font-bold text-text-dim">Checking...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

        </div><!-- end df-body -->
        <div id="footer"></div>
    </div><!-- end df-main -->

    <script src="/static/shared.js"></script>
    <script>
        initPage('Settings');

        async function loadSettings() {
            const [settingsResp, rulesResp, entitiesResp, healthResp] = await Promise.all([
                fetch('/api/settings'),
                fetch('/api/settings/rules'),
                fetch('/api/settings/entities'),
                fetch('/api/health'),
            ]);

            const settings = await settingsResp.json();
            const rules = await rulesResp.json();
            const entities = await entitiesResp.json();
            const health = await healthResp.json();

            // Fill paths
            document.getElementById('archive-root').value = settings.archive_root || '';
            document.getElementById('watch-folder').value = settings.scan_watch_folder || '';

            // Fill AI settings
            const threshold = Math.round((settings.confidence_threshold || 0.75) * 100);
            document.getElementById('threshold-slider').value = threshold;
            document.getElementById('threshold-display').textContent = `${threshold}%`;
            document.getElementById('llm-provider').value = settings.llm_provider || 'openrouter';
            document.getElementById('llm-model').value = settings.llm_model || settings.openrouter_model || 'google/gemini-2.0-flash-001';
            document.getElementById('llm-base-url').value = settings.llm_base_url || '';
            if (settings.llm_api_key) {
                document.getElementById('llm-api-key').placeholder = '••••••• configured';
            }

            // Threshold slider live update
            document.getElementById('threshold-slider').addEventListener('input', e => {
                document.getElementById('threshold-display').textContent = `${e.target.value}%`;
            });

            // Entities
            const grid = document.getElementById('entities-grid');
            const allEntities = [
                ...(entities.family || []).map(f => ({ ...f, kind: 'person' })),
                ...(entities.entities || []).map(e => ({ ...e, kind: 'biz' })),
            ];
            grid.innerHTML = allEntities.map(e => {
                const isPerson = e.kind === 'person';
                const iconBg = isPerson ? '#E9EDF7' : '#F6E9D3';
                const iconColor = isPerson ? '#34508C' : '#B5751F';
                const icon = isPerson ? 'person' : 'apartment';
                const label = e.relation || e.type || 'Entity';
                const deleteAction = isPerson
                    ? `deleteFamily('${e.name}')`
                    : `deleteEntity('${e.id || e.name}')`;
                return `
                <div class="group flex items-center gap-[13px] bg-white border border-border-card rounded-[14px] py-[14px] px-4 shadow-card relative">
                    <div class="w-[38px] h-[38px] rounded-[11px] flex items-center justify-center flex-shrink-0" style="background:${iconBg};">
                        <span class="ms" style="font-size:20px;color:${iconColor};">${icon}</span>
                    </div>
                    <div class="min-w-0 flex-1">
                        <p class="m-0 font-bold text-[13.5px] text-ink truncate">${e.name}</p>
                        <p class="m-0 mt-[2px] text-[10px] font-bold tracking-[.08em] uppercase text-text-label">${label}</p>
                    </div>
                    <button onclick="${deleteAction}" class="opacity-0 group-hover:opacity-100 transition-opacity border-none bg-transparent cursor-pointer p-1" title="Remove">
                        <span class="ms" style="font-size:18px;color:#BE4029;">close</span>
                    </button>
                </div>`;
            }).join('');

            // Rules
            document.getElementById('rule-count').textContent = `${rules.rules.length} Active`;
            const rulesList = document.getElementById('rules-list');
            rulesList.innerHTML = rules.rules.map(r => `
                <div class="group flex items-center gap-2 bg-inset rounded-[11px] py-[11px] px-[13px]">
                    <div class="flex-1 min-w-0">
                        <p class="m-0 font-mono text-[12px] font-semibold text-ink truncate">${r.id}</p>
                        <p class="m-0 mt-[3px] text-[11px] text-text-faint truncate">${r.file_to}</p>
                    </div>
                    <button onclick="deleteRule('${r.id}')" class="opacity-0 group-hover:opacity-100 transition-opacity border-none bg-transparent cursor-pointer p-0.5 flex-shrink-0" title="Remove rule">
                        <span class="ms" style="font-size:16px;color:#BE4029;">close</span>
                    </button>
                </div>
            `).join('');

            // Health
            document.getElementById('health-llm').textContent = (health.model || '').split('/').pop() || '—';
            // Styled from the level the server reports; an unknown level stays neutral,
            // so local-only mode is never presented as a key failure.
            const HEALTH_LEVEL = {
                ok: ['bg-success', 'text-success'],
                neutral: ['bg-text-dim', 'text-text-olive'],
                warning: ['bg-danger', 'text-danger'],
            };
            const [dotClass, textClass] = HEALTH_LEVEL[health.llm_status_level]
                || HEALTH_LEVEL.neutral;
            const apiEl = document.getElementById('health-api');
            const dot = document.createElement('span');
            dot.className = `w-[7px] h-[7px] rounded-pill ${dotClass}`;
            apiEl.replaceChildren(dot, textElement('span',
                `text-[12.5px] font-bold ${textClass}`, health.llm_status_label || 'Unavailable'));
            apiEl.setAttribute('title', health.llm_status_detail || '');
        }

        const PROVIDER_DEFAULTS = {
            openrouter: { url: 'https://openrouter.ai/api/v1', model: 'google/gemini-2.0-flash-001' },
            openai: { url: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
            groq: { url: 'https://api.groq.com/openai/v1', model: 'llama-3.3-70b-versatile' },
            ollama: { url: 'http://localhost:11434/v1', model: 'llama3.2' },
        };

        function onProviderChange() {
            const provider = document.getElementById('llm-provider').value;
            const defaults = PROVIDER_DEFAULTS[provider] || PROVIDER_DEFAULTS.openrouter;
            document.getElementById('llm-base-url').placeholder = defaults.url;
            document.getElementById('llm-model').placeholder = defaults.model;
            const modelInput = document.getElementById('llm-model');
            const isDefault = Object.values(PROVIDER_DEFAULTS).some(d => d.model === modelInput.value);
            if (!modelInput.value || isDefault) {
                modelInput.value = defaults.model;
            }
        }

        async function saveSettings() {
            const body = {
                confidence_threshold: parseInt(document.getElementById('threshold-slider').value) / 100,
                llm_provider: document.getElementById('llm-provider').value,
                llm_model: document.getElementById('llm-model').value,
                archive_root: document.getElementById('archive-root').value,
                scan_watch_folder: document.getElementById('watch-folder').value,
            };
            const baseUrl = document.getElementById('llm-base-url').value.trim();
            if (baseUrl) body.llm_base_url = baseUrl;
            const apiKey = document.getElementById('llm-api-key').value.trim();
            if (apiKey) body.llm_api_key = apiKey;

            try {
                const resp = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    showToast(err.detail || 'Failed to save settings', 'error');
                    return;
                }
                showToast('Settings saved', 'success', 3000);
            } catch (e) {
                showToast('Network error — could not save settings', 'error');
            }
        }

        async function testConnection() {
            const btn = document.getElementById('btn-test-conn');
            btn.disabled = true;
            btn.innerHTML = '<span class="ms" style="font-size:17px;animation:dfspin 1s linear infinite;">progress_activity</span> Saving & Testing...';
            try {
                await saveSettings();
                const resp = await fetch('/api/settings/test-connection', { method: 'POST' });
                const data = await resp.json();
                if (data.status === 'connected') {
                    showToast(`Connected — model: ${data.model}`, 'success', 5000);
                } else if (data.status === 'local_only') {
                    // Not a failure: no connection was attempted, by configuration.
                    showToast(data.error, 'info', 5000);
                } else {
                    showToast(`Connection failed: ${data.error}`, 'error', 0);
                }
            } catch (e) {
                showToast('Network error testing connection', 'error');
            }
            btn.disabled = false;
            btn.innerHTML = '<span class="ms" style="font-size:17px;">cable</span> Test Connection';
        }

        async function validatePaths() {
            try {
                const resp = await fetch('/api/settings/validate-paths', { method: 'POST' });
                const data = await resp.json();
                for (const [key, info] of Object.entries(data)) {
                    if (info.status === 'ok') {
                        showToast(`${info.label}: OK`, 'success', 3000);
                    } else if (info.status === 'missing') {
                        showToast(`${info.label}: path not found — ${info.path}`, 'error', 0);
                    } else if (info.status === 'not_writable') {
                        showToast(`${info.label}: not writable — ${info.path}`, 'warning', 0);
                    } else {
                        showToast(`${info.label}: not configured`, 'warning', 3000);
                    }
                }
            } catch (e) {
                showToast('Network error validating paths', 'error');
            }
        }

        // ---- Delete operations ----
        async function deleteEntity(id) {
            if (!confirm(`Remove entity "${id}"? This won't delete any filed documents.`)) return;
            try {
                const resp = await fetch(`/api/settings/entities/${encodeURIComponent(id)}`, { method: 'DELETE' });
                if (!resp.ok) { showToast('Failed to delete entity', 'error'); return; }
                showToast('Entity removed', 'success', 3000);
                loadSettings();
            } catch (e) { showToast('Network error', 'error'); }
        }

        async function deleteFamily(name) {
            if (!confirm(`Remove "${name}" from family members?`)) return;
            try {
                const resp = await fetch(`/api/settings/family/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (!resp.ok) { showToast('Failed to delete family member', 'error'); return; }
                showToast('Family member removed', 'success', 3000);
                loadSettings();
            } catch (e) { showToast('Network error', 'error'); }
        }

        async function deleteRule(id) {
            if (!confirm(`Delete rule "${id}"? Documents already filed won't be affected.`)) return;
            try {
                const resp = await fetch(`/api/settings/rules/${encodeURIComponent(id)}`, { method: 'DELETE' });
                if (!resp.ok) { showToast('Failed to delete rule', 'error'); return; }
                showToast('Rule deleted', 'success', 3000);
                loadSettings();
            } catch (e) { showToast('Network error', 'error'); }
        }

        // ---- Add modals ----
        function _showModal(title, fields, onSubmit) {
            const existing = document.getElementById('settings-modal');
            if (existing) existing.remove();

            const fieldHtml = fields.map(f => `
                <div>
                    <label class="block text-[10px] font-bold tracking-[.1em] uppercase text-text-label mb-[7px]">${f.label}</label>
                    ${f.type === 'select'
                        ? `<select id="modal-${f.id}" class="w-full bg-white border border-border-primary rounded-input py-[10px] px-3 text-[13px] text-ink outline-none">
                            ${f.options.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}
                           </select>`
                        : `<input id="modal-${f.id}" type="text" placeholder="${f.placeholder || ''}"
                            class="w-full bg-white border border-border-primary rounded-input py-[10px] px-3 font-${f.mono ? 'mono' : '[inherit]'} text-[${f.mono ? '12px' : '13px'}] text-ink outline-none" />`
                    }
                </div>
            `).join('');

            const modal = document.createElement('div');
            modal.id = 'settings-modal';
            modal.className = 'fixed inset-0 z-[200] flex items-center justify-center';
            modal.innerHTML = `
                <div class="absolute inset-0 bg-[rgba(20,23,28,0.42)] backdrop-blur-[3px]" onclick="closeSettingsModal()"></div>
                <div class="relative w-full max-w-[440px] bg-soft-hover rounded-modal shadow-modal overflow-hidden">
                    <div class="py-[18px] px-5 border-b border-border-card flex items-center justify-between">
                        <h3 class="m-0 font-headline font-extrabold text-[16px] text-ink">${title}</h3>
                        <button onclick="closeSettingsModal()" class="w-[30px] h-[30px] border-none bg-tile rounded-[9px] flex items-center justify-center cursor-pointer">
                            <span class="ms" style="font-size:18px;color:#8A8B72;">close</span>
                        </button>
                    </div>
                    <div class="p-5 flex flex-col gap-4">${fieldHtml}</div>
                    <div class="px-5 py-4 border-t border-border-card flex justify-end gap-3">
                        <button onclick="closeSettingsModal()" class="py-[10px] px-4 border-none bg-transparent text-text-muted font-bold text-[13px] cursor-pointer rounded-btn hover:bg-sidebar transition-colors">Cancel</button>
                        <button id="modal-submit" class="py-[10px] px-5 bg-ink text-[#F4F1EA] border-none rounded-btn font-bold text-[13px] cursor-pointer hover:-translate-y-px transition-transform">Add</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('modal-submit').addEventListener('click', onSubmit);
            // Focus first input
            const first = modal.querySelector('input');
            if (first) setTimeout(() => first.focus(), 100);
            // Escape to close
            modal.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettingsModal(); });
        }

        function closeSettingsModal() {
            const m = document.getElementById('settings-modal');
            if (m) m.remove();
        }

        function openAddFamily() {
            _showModal('Add Family Member', [
                { id: 'name', label: 'Name', placeholder: 'e.g. Jane Scott' },
                { id: 'relation', label: 'Relation', placeholder: 'e.g. Spouse, Son, Daughter' },
            ], async () => {
                const name = document.getElementById('modal-name').value.trim();
                const relation = document.getElementById('modal-relation').value.trim();
                if (!name) { showToast('Name is required', 'warning'); return; }
                try {
                    const resp = await fetch('/api/settings/family', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, relation }),
                    });
                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({}));
                        showToast(err.detail || 'Failed to add', 'error'); return;
                    }
                    showToast(`Added ${name}`, 'success', 3000);
                    closeSettingsModal();
                    loadSettings();
                } catch (e) { showToast('Network error', 'error'); }
            });
        }

        function openAddEntity() {
            _showModal('Add Entity', [
                { id: 'name', label: 'Name', placeholder: 'e.g. Acme Corp LLC' },
                { id: 'type', label: 'Type', type: 'select', options: [
                    { value: 'business', label: 'Business' },
                    { value: 'investment', label: 'Investment' },
                    { value: 'personal', label: 'Personal' },
                ]},
                { id: 'directory', label: 'Directory', placeholder: 'e.g. AcmeCorp', mono: true },
            ], async () => {
                const name = document.getElementById('modal-name').value.trim();
                const type = document.getElementById('modal-type').value;
                const directory = document.getElementById('modal-directory').value.trim();
                if (!name) { showToast('Name is required', 'warning'); return; }
                try {
                    const resp = await fetch('/api/settings/entities', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, type, directory: directory || undefined }),
                    });
                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({}));
                        showToast(err.detail || 'Failed to add', 'error'); return;
                    }
                    showToast(`Added ${name}`, 'success', 3000);
                    closeSettingsModal();
                    loadSettings();
                } catch (e) { showToast('Network error', 'error'); }
            });
        }

        function openAddRule() {
            _showModal('Add Filing Rule', [
                { id: 'id', label: 'Rule ID', placeholder: 'e.g. pnc_business_checking', mono: true },
                { id: 'file_to', label: 'File To', placeholder: 'e.g. PNC/Business/Checking', mono: true },
                { id: 'institution', label: 'Institution Match', placeholder: 'e.g. pnc', mono: true },
            ], async () => {
                const id = document.getElementById('modal-id').value.trim();
                const file_to = document.getElementById('modal-file_to').value.trim();
                const institution = document.getElementById('modal-institution').value.trim();
                if (!id) { showToast('Rule ID is required', 'warning'); return; }
                const rule = { id, file_to };
                if (institution) rule.match = { institution };
                try {
                    const resp = await fetch('/api/settings/rules', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(rule),
                    });
                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({}));
                        showToast(err.detail || 'Failed to add', 'error'); return;
                    }
                    showToast(`Rule "${id}" added`, 'success', 3000);
                    closeSettingsModal();
                    loadSettings();
                } catch (e) { showToast('Network error', 'error'); }
            });
        }

        loadSettings();
    </script>
</body>
</html>
